
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://i.imgur.com" crossorigin>
<link rel="dns-prefetch" href="https://i.imgur.com">
<title>TEXTILE ARCHIVE</title>
<style>
:root{--bg:#080808;--fg:#fff;--muted:#999;--line:rgba(255,255,255,.22)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}
body.light{--bg:#f5f5f2;--fg:#111;--muted:#777;--line:rgba(0,0,0,.2)}
button{font:inherit;cursor:pointer}
header{position:fixed;z-index:100;top:0;left:0;width:100%;padding:24px 32px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
header>*{pointer-events:auto}
.logo{font-size:calc(14px + 4pt);font-weight:700;cursor:pointer}
.header-right{display:flex;align-items:center;gap:24px}
.counter{font-size:11px;letter-spacing:.08em}
.theme-button{width:36px;height:36px;border:1px solid var(--fg);border-radius:50%;background:#fff}
body.light .theme-button{background:#080808}
.page{position:absolute;inset:0;display:none}
.page.active{display:block}
.back-button{border:0;background:transparent;color:var(--fg);padding:0;font-size:16px}

/* HOME */
#home{overflow:hidden}
.floating-item{position:absolute;top:0;left:0;width:clamp(72px,10vw,145px);aspect-ratio:1;overflow:hidden;cursor:grab;touch-action:none;user-select:none}
.floating-item:active{cursor:grabbing}
.floating-item img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none;user-select:none}
.home-footer{position:absolute;bottom:28px;left:32px;font-size:10px;letter-spacing:.08em;color:var(--muted);pointer-events:none}
.home-guide{position:absolute;z-index:40;display:flex;align-items:center;gap:10px;color:var(--fg);font-size:16px;white-space:nowrap;pointer-events:none}
.guide-top{top:67px;right:32px;flex-direction:column;align-items:flex-end;gap:5px}
.guide-bottom{bottom:65px;left:32px}
.guide-hand{display:inline-flex;align-items:center;justify-content:center;width:34px;height:38px;animation:guideSynchronizedBlink 1.8s ease-in-out infinite}
.guide-hand svg{width:30px;height:35px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px currentColor)}
.guide-bottom .guide-hand svg{transform:rotate(45deg)}
@keyframes guideSynchronizedBlink{0%,100%{opacity:1}50%{opacity:.12}}

/* DETAIL */
#detail{overflow:hidden}
.detail-layout{width:100%;height:100%;display:grid;grid-template-rows:minmax(0,2fr) minmax(0,1fr)}
.detail-image-wrap{position:relative;width:100%;height:100%;min-height:0;overflow:hidden;background:var(--bg) center/cover no-repeat;cursor:zoom-in}
.detail-info{position:relative;min-height:0;padding:48px 32px 24px;display:flex;flex-direction:column;align-items:flex-start}
.detail-image-hint{position:absolute;top:10px;right:32px;display:flex;align-items:center;gap:8px;font-size:16px;white-space:nowrap;pointer-events:none}
.detail-image-hint .guide-hand svg{transform:rotate(-45deg)}
.detail-back{margin-bottom:18px}
.detail-number{font-size:10px;color:var(--muted);margin-bottom:8px}
.detail-title{font-size:22px;font-weight:700;margin:0 0 9px}
.detail-description{font-size:12px;line-height:1.65;color:var(--muted);white-space:pre-line;overflow-y:auto;max-width:850px;min-height:0;padding-right:8px;flex:1}
.mockup-entry{position:absolute;right:20px;bottom:20px;z-index:4;display:flex;align-items:center;justify-content:center;width:58px;height:58px;padding:0;border:1px solid rgba(255,255,255,.58);border-radius:50%;background:rgba(12,12,12,.72);color:#fff;backdrop-filter:blur(12px);box-shadow:0 10px 28px rgba(0,0,0,.18)}
.mockup-entry:hover{background:#fff;color:#111;border-color:#fff}
.mockup-entry svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.55}
.fullscreen-bottom .mockup-entry{position:static;right:auto;bottom:auto;z-index:auto;width:44px;height:44px;flex-shrink:0;border-color:rgba(255,255,255,.42);background:rgba(255,255,255,.09);box-shadow:none}
.fullscreen-bottom .mockup-entry svg{width:20px;height:20px}
.mockup-hint-layer{position:absolute;inset:0;z-index:5;pointer-events:none;transition:opacity .22s ease,visibility .22s ease}
.mockup-hint-layer.is-hidden{opacity:0;visibility:hidden}
.mockup-hint-button{position:absolute;transform:translate(-50%,-50%);width:56px;height:56px;padding:0;border:0;background:transparent;color:#111;display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer}
.mockup-hint-button .guide-hand{position:relative;width:34px;height:38px;animation:guideSynchronizedBlink 1.8s ease-in-out infinite}
.mockup-hint-button .guide-hand svg{width:30px;height:35px;transform:rotate(45deg);fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.mockup-hint-button:hover{transform:translate(-50%,-50%) scale(1.06)}

/* FULLSCREEN */
#fullscreen{overflow:hidden;cursor:grab;touch-action:none}
#fullscreen.dragging{cursor:grabbing}
.pattern-layer{position:absolute;inset:0;overflow:hidden;background:var(--bg);pointer-events:none}
.pattern-tile{position:absolute;display:block;max-width:none;object-fit:fill;pointer-events:none;user-select:none}
.fullscreen-title{position:absolute;z-index:30;top:88px;left:32px;color:#fff;font-size:29px;font-weight:700;letter-spacing:-.025em;text-shadow:0 1px 10px #000;pointer-events:none}
.fullscreen-subtitle{position:absolute;z-index:30;top:126px;left:32px;color:#fff;font-size:16px;font-weight:700;text-shadow:0 1px 10px #000;pointer-events:none}
.full-back{position:absolute;z-index:30;left:32px;top:166px;color:#fff;font-size:16px;text-shadow:0 1px 8px #000}
.fullscreen-top{position:absolute;z-index:20;top:210px;left:32px;color:#fff;pointer-events:none;text-shadow:0 1px 8px #000}
.fullscreen-top span{font-size:11px}
body:has(#fullscreen.active) header{color:#fff}
body:has(#fullscreen.active) .logo,body:has(#fullscreen.active) .counter{color:#fff;text-shadow:0 1px 8px #000}
body:has(#fullscreen.active) .theme-button{display:none}
#fullscreen,#fullscreen *{color:#fff}
.fullscreen-bottom{position:absolute;z-index:20;bottom:30px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:30px;background:rgba(20,20,20,.65);backdrop-filter:blur(12px)}
.color-swatch{width:22px;height:22px;padding:0;flex-shrink:0;border:1px solid rgba(255,255,255,.5);border-radius:50%}
.color-swatch.active{outline:1px solid #fff;outline-offset:4px;transform:scale(1.1)}
.color-swatch:disabled{opacity:.35;cursor:not-allowed}
.zoom-controls{position:absolute;z-index:20;right:30px;bottom:30px;display:flex;align-items:center;gap:12px}
.zoom-controls button{width:32px;height:32px;border:1px solid #fff;border-radius:50%;background:rgba(0,0,0,.65);color:#fff}
.zoom-value{min-width:40px;text-align:center;font-size:11px}

/* MOCKUP */
#mockup{overflow:hidden}
.mockup-layout{position:absolute;inset:83px 28px 24px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;min-height:0}
.mockup-workspace{display:flex;flex-direction:column;min-width:0;min-height:0;gap:14px}
.mockup-toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px}
.mockup-heading{min-width:0}
.mockup-eyebrow{display:block;font-size:10px;letter-spacing:.13em;color:var(--muted);margin-bottom:7px}
.mockup-heading h2{font-size:23px;margin:0;font-weight:700}
.mockup-type-nav{display:flex;flex-wrap:wrap;gap:7px}
.mockup-type-button{border:1px solid var(--line);background:transparent;color:var(--fg);font-size:12px;border-radius:20px;padding:9px 15px}
.mockup-type-button.active{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mockup-stage{flex:1;min-height:0;background:#f8f8f8;position:relative;overflow:hidden;border-radius:5px}
#mockupCanvas{display:block;width:100%;height:100%;object-fit:contain;touch-action:none;cursor:crosshair}
#mockupCanvas.dragging{cursor:grabbing}
.mockup-stage-note{position:absolute;bottom:14px;left:16px;font-size:11px;color:#777;pointer-events:none;background:rgba(255,255,255,.85);padding:5px 8px;border-radius:4px}
.mockup-status{position:absolute;top:13px;left:13px;font-size:11px;padding:7px 10px;color:#393939;background:rgba(255,255,255,.94);border-radius:5px;pointer-events:none}
.mockup-inspector{min-width:0;min-height:0;overflow-y:auto;padding:20px;border:1px solid var(--line);border-radius:6px}
.inspector-header{font-size:12px;font-weight:700;letter-spacing:.08em;margin:0 0 18px}
.inspector-layer-name{font-size:20px;font-weight:700;margin:0 0 6px}
.inspector-hint{color:var(--muted);font-size:11px;line-height:1.6;margin:0 0 20px}
.inspector-section{margin-bottom:24px}
.inspector-label{display:block;font-size:11px;color:var(--muted);margin-bottom:12px;letter-spacing:.07em}
.inspector-swatches{display:flex;flex-wrap:wrap;gap:16px;padding:7px 5px}
.inspector-swatches .color-swatch{border-color:#aaa}
.inspector-swatches .color-swatch.active{outline-color:var(--fg)}
.inspector-select-row{display:flex;gap:7px;margin-bottom:15px}
.inspector-select-row button{flex:1;font-size:11px;padding:10px 8px;background:none;color:var(--fg);border:1px solid var(--line)}
.inspector-select-row button.active{background:var(--fg);color:var(--bg)}
.inspector-slider-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:14px 0 4px}
.inspector-slider-row output{color:var(--muted)}
.inspector-range{width:100%;accent-color:var(--fg);cursor:pointer}
.inspector-actions{display:flex;gap:8px;margin-top:18px}
.inspector-action{flex:1;border:1px solid var(--fg);background:transparent;color:var(--fg);padding:12px 8px;font-size:11px}
.inspector-action.primary{background:var(--fg);color:var(--bg)}
.inspector-empty{min-height:175px;display:flex;align-items:center;color:var(--muted);font-size:12px;line-height:1.9}
.mockup-color-box{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.mockup-native-color{width:43px;height:36px;border:0;background:none;padding:0;cursor:pointer}
.mockup-hex{flex:1;min-width:0;height:35px;border:1px solid var(--line);border-radius:2px;background:transparent;color:var(--fg);padding:6px 9px;font:12px monospace}
.mockup-eyedropper{height:35px;min-width:36px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:16px}
.mockup-hue{width:100%;height:14px;display:block;accent-color:#fff;cursor:pointer;margin:12px 0 16px;appearance:none;border-radius:7px;background:linear-gradient(to right,red,#ff0,#0f0,#0ff,#00f,#f0f,red)}
.mockup-hue::-webkit-slider-thumb{appearance:none;width:17px;height:20px;border-radius:3px;border:2px solid #fff;box-shadow:0 0 0 1px #555;background:transparent}
.mockup-hue::-moz-range-thumb{width:15px;height:18px;border-radius:3px;border:2px solid #fff;box-shadow:0 0 0 1px #555;background:transparent}
.mockup-sv{display:block;width:100%;height:auto;aspect-ratio:1.6;cursor:crosshair;border:1px solid var(--line);touch-action:none}
.mockup-cmyk{display:grid;grid-template-columns:15px minmax(0,1fr) 50px 12px;align-items:center;gap:7px;margin:9px 0;font-size:12px}
.mockup-cmyk input[type=range]{width:100%;accent-color:#777;cursor:pointer}
.mockup-cmyk input[type=number]{width:50px;min-width:0;padding:5px;color:var(--fg);background:transparent;border:1px solid var(--line);font:12px monospace}
.mockup-preset-colors{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.mockup-preset-colors button{width:22px;height:22px;border:1px solid #888;border-radius:50%;padding:0}
.mockup-small{color:var(--muted);font-size:11px;line-height:1.55}
.mockup-error{color:#bd4b4b;font-size:11px;line-height:1.55;margin:8px 0}
@media(max-width:820px){
.mockup-layout{inset:76px 16px 13px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.mockup-workspace{flex:0 0 auto;min-height:460px}
.mockup-stage{height:53vh;min-height:360px;flex:none}
.mockup-inspector{flex:0 0 auto;min-height:260px;overflow:visible}
.mockup-heading h2{font-size:20px}
.mockup-type-button{padding:8px 12px}
.mockup-stage-note{font-size:10px}
}
@media(max-width:700px){
header{padding:20px}
.floating-item{width:clamp(55px,17vw,100px)}
.guide-top{top:61px;right:20px}
.guide-bottom{left:20px;bottom:58px}
.home-footer{left:20px}
.detail-info{padding:48px 20px 16px}
.detail-image-hint{top:9px;right:20px}
.detail-title{font-size:18px}
.detail-description{font-size:11px;line-height:1.5;padding-bottom:55px}
.mockup-entry{right:16px;bottom:16px;width:52px;height:52px}
.fullscreen-title{top:78px;left:16px;font-size:24px}
.fullscreen-subtitle{top:110px;left:16px;font-size:16px}
.full-back{left:16px;top:150px}
.fullscreen-top{left:16px;top:195px}
.fullscreen-bottom{bottom:25px;gap:10px}
.zoom-controls{right:15px;bottom:90px}
.mockup-hint-button{width:50px;height:50px}
}

/* MOCKUP TWO-PANEL LAYOUT */
body:has(#mockup.active){--bg:#f7f7f5;--fg:#111;--muted:#777;--line:rgba(0,0,0,.22);background:#f7f7f5;color:#111}
body:has(#mockup.active) .logo,body:has(#mockup.active) .counter{color:#111}
body:has(#mockup.active) .theme-button{background:#111;border-color:#111}
#mockup{background:#f7f7f5;color:#111}
#mockup .back-button{color:#111}
.mockup-back-top{position:absolute;top:78px;left:30px;z-index:6}
.mockup-layout{inset:106px 30px 28px;max-width:1235px;margin:0 auto;grid-template-columns:minmax(0,1fr) 414px;gap:65px;align-items:center}
.mockup-workspace{height:100%;min-height:0;display:flex;align-items:center;justify-content:center}
.mockup-stage{width:100%;height:100%;max-width:610px;max-height:745px;flex:none;background:transparent;border-radius:0;display:flex;justify-content:center;align-items:center;overflow:hidden}
#mockupCanvas{display:block;width:100%;height:100%;object-fit:contain;touch-action:none;cursor:pointer}
#mockupCanvas.dragging{cursor:grabbing}
.mockup-stage-note{display:none}
.mockup-status{display:none}
.mockup-status.is-error{display:block;color:#a33030;left:8%;top:8%}
.mockup-inspector{width:100%;height:auto;min-height:580px;max-height:calc(100vh - 135px);padding:32px 22px 28px;border:1px solid #858585;border-radius:46px;overflow:hidden;display:flex;flex-direction:column;align-self:center;background:transparent}
.mockup-panel-head{flex-shrink:0}
.mockup-panel-head .mockup-eyebrow{font-size:12px;letter-spacing:.1em;color:#858585;margin-bottom:8px}
.mockup-panel-head h2{font-size:26px;margin:0 0 22px;font-weight:700;letter-spacing:-.025em}
.mockup-type-nav{display:flex;gap:7px;flex-wrap:nowrap;padding-bottom:21px;border-bottom:1px solid #ededeb;margin-bottom:23px}
.mockup-type-button{padding:10px 15px;white-space:nowrap;border:1px solid #c9c9c7;font-size:12px;color:#141414;background:transparent;border-radius:30px}
.mockup-type-button.active{background:#121212;color:white;border-color:#121212}
.mockup-panel-scroll{flex:1;overflow:auto;min-height:0;padding:0 8px 0 8px;scrollbar-width:thin}
.mockup-inspector .inspector-header{display:none}
.mockup-inspector .inspector-layer-name,.mockup-inspector .inspector-hint{display:none}
.mockup-inspector .inspector-section{margin-bottom:28px}
.mockup-inspector .inspector-label{font-size:12px;color:#808080;letter-spacing:.04em;margin:0 0 16px}
.mockup-inspector .inspector-swatches{gap:16px;padding:7px 8px 10px}
.mockup-inspector .inspector-swatches .color-swatch{width:25px;height:25px;border-color:#bcbcbc}
.mockup-inspector .inspector-swatches .color-swatch.active{outline:1.5px solid #111;outline-offset:5px}
.mockup-inspector .inspector-slider-row{margin:18px 0 6px;font-size:13px}
.mockup-inspector .inspector-slider-row output{color:#777}
.mockup-inspector .inspector-range{accent-color:#111}
.mockup-inspector .inspector-select-row button{border-radius:24px;border:1px solid #bdbdbd;padding:12px 8px}
.mockup-inspector .inspector-select-row button.active{background:#111;color:#fff}
.mockup-inspector .mockup-color-box{margin-top:5px;margin-bottom:16px}
.mockup-inspector .mockup-hex{border-color:#c3c3c3;color:#111}
.mockup-inspector .mockup-eyedropper{border-color:#c3c3c3;color:#111}
.mockup-inspector .mockup-sv{border:0;aspect-ratio:1.6}
.mockup-inspector .mockup-cmyk input[type=number]{color:#111;border-color:#c9c9c9}
.mockup-inspector .mockup-small{color:#868686;line-height:1.6}
.mockup-inspector .inspector-actions{display:flex;align-items:center;justify-content:center;flex:0 0 auto;padding-top:16px;margin-top:0;gap:12px}
.mockup-inspector .inspector-action{border:1px solid #121212;color:#121212;padding:12px 20px;max-width:170px;background:transparent;font-size:12px}
.mockup-inspector #mockupReset{min-width:170px}
@media(max-width:1100px){
.mockup-layout{grid-template-columns:minmax(0,1fr) 370px;gap:26px}
.mockup-inspector{padding-left:19px;padding-right:19px}
.mockup-panel-head h2{font-size:23px}
.mockup-type-button{padding:9px 12px}
}
@media(max-width:820px){
.mockup-back-top{top:70px;left:18px}
.mockup-layout{inset:110px 16px 20px;display:flex;flex-direction:column;align-items:stretch;max-width:none;gap:24px;overflow:auto}
.mockup-workspace{flex:none;height:auto;min-height:0;max-height:none}
.mockup-stage{height:min(55vh,560px);max-width:none;max-height:none}
.mockup-inspector{width:100%;max-width:580px;margin:0 auto;max-height:none;min-height:440px;overflow:visible;padding:26px 18px;border-radius:35px}
.mockup-panel-scroll{overflow:visible}
.mockup-panel-head h2{font-size:23px}
.mockup-type-nav{gap:5px}
}
@media(max-width:430px){
.mockup-type-button{font-size:11px;padding:9px 10px}
.mockup-inspector{padding:24px 14px}
.mockup-inspector #mockupReset{min-width:125px}
.mockup-inspector .inspector-actions{gap:8px}
}

/* RETURN BUTTON */
.back-button{
display:inline-flex;
align-items:center;
justify-content:center;
flex-shrink:0;
width:max-content;
min-height:52px;
padding:13px 22px;
border:1px solid rgba(255,255,255,.28);
border-radius:999px;
background:rgba(44,44,44,.94);
color:#fff;
font-size:19px;
font-weight:500;
line-height:1.3;
white-space:nowrap;
text-shadow:none;
box-shadow:0 4px 16px rgba(0,0,0,.10);
backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
transition:background .2s ease,border-color .2s ease,transform .2s ease;
}
.back-button:hover{
background:rgba(65,65,65,.98);
border-color:rgba(255,255,255,.55);
transform:translateY(-1px);
}
.back-button:focus-visible{outline:2px solid #fff;outline-offset:3px}
#mockup .back-button{color:#fff}
.full-back{font-size:19px}
.home-guide,.detail-image-hint{font-size:20px}
.home-guide>span:not(.guide-hand),
.detail-image-hint>span:not(.guide-hand){
animation:guideSynchronizedBlink 1.8s ease-in-out infinite;
}

/* MOCKUP BUTTON */
.mockup-entry{
width:auto;
min-width:151px;
height:58px;
padding:0 18px;
gap:10px;
border-radius:999px;
white-space:nowrap;
}
.mockup-entry span{font-size:15px;font-weight:600;line-height:1}
.fullscreen-bottom .mockup-entry{
width:auto;
min-width:136px;
height:44px;
padding:0 14px;
gap:8px;
}
.fullscreen-bottom .mockup-entry span{font-size:13px}

/* MOCKUP THEME */
body:has(#mockup.active){
--bg:#080808;--fg:#fff;--muted:#aaa;--line:rgba(255,255,255,.22);
--mockup-border:#888;--mockup-faint:#9a9a9a;
--mockup-tab-border:#666;--mockup-active-bg:#fff;--mockup-active-fg:#111;
background:var(--bg);color:var(--fg);
}
body.light:has(#mockup.active){
--bg:#f7f7f5;--fg:#111;--muted:#777;--line:rgba(0,0,0,.22);
--mockup-border:#858585;--mockup-faint:#808080;
--mockup-tab-border:#c9c9c7;--mockup-active-bg:#121212;--mockup-active-fg:#fff;
}
body:has(#mockup.active) .logo,
body:has(#mockup.active) .counter{color:var(--fg)}
body:has(#mockup.active) .theme-button{background:#fff;border-color:var(--fg)}
body.light:has(#mockup.active) .theme-button{background:#080808}
#mockup{background:var(--bg);color:var(--fg)}
#mockup .back-button{color:#fff}
.mockup-inspector{border-color:var(--mockup-border)}
.mockup-panel-head .mockup-eyebrow{color:var(--mockup-faint)}

function loadImage(src){

});

}

function createFloatingItems(){
floatingContainer.innerHTML="";
floatingItems.length=0;
const homeImages=TEXTILES.map((p,patternIndex)=>({patternIndex}));
const cols=Math.ceil(Math.sqrt(homeImages.length*innerWidth/innerHeight));
const rows=Math.ceil(homeImages.length/cols);

homeImages.forEach(({patternIndex},index)=>{
const p=TEXTILES[patternIndex];
const item=document.createElement("div");
item.className="floating-item";
const img=document.createElement("img");
img.alt=p.title;
img.draggable=false;
img.decoding="async";
if("fetchPriority" in img)img.fetchPriority=index<5?"auto":"low";
img.src=imgur(homeImageForPattern(patternIndex))||"";
item.appendChild(img);
floatingContainer.appendChild(item);

const size=item.getBoundingClientRect().width;
const col=index%cols;
const row=Math.floor(index/cols);
const cellW=innerWidth/cols;
const cellH=Math.max(1,(innerHeight-100)/rows);
const x=col*cellW+(cellW-size)/2;
const y=65+row*cellH+(cellH-size)/2;
const angle=Math.random()*Math.PI*2;
const speed=.8+Math.random();

const d={
element:item,image:img,patternIndex,x,y,size,
vx:Math.cos(angle)*speed,
vy:Math.sin(angle)*speed,
paused:false,
dragging:false,
pointerId:null,
startX:0,
startY:0,
originX:0,
originY:0,
moved:false
};

item.style.transform=`translate3d(${x}px,${y}px,0)`;

item.addEventListener("pointerdown",e=>{
if(e.button!==0&&e.pointerType==="mouse")return;
d.dragging=true;
d.pointerId=e.pointerId;
d.startX=e.clientX;
d.startY=e.clientY;
d.originX=d.x;
d.originY=d.y;
d.moved=false;
d.paused=true;
item.setPointerCapture(e.pointerId);
});

item.addEventListener("pointermove",e=>{
if(!d.dragging||e.pointerId!==d.pointerId)return;
const dx=e.clientX-d.startX;
const dy=e.clientY-d.startY;
if(Math.hypot(dx,dy)>6)d.moved=true;
d.x=d.originX+dx;
d.y=d.originY+dy;
item.style.transform=`translate3d(${d.x}px,${d.y}px,0)`;
});

function release(e){
if(!d.dragging||e.pointerId!==d.pointerId)return;
d.dragging=false;
d.pointerId=null;
d.paused=false;
if(!d.moved)openDetail(patternIndex);
}

item.addEventListener("pointerup",release);
item.addEventListener("pointercancel",()=>{
d.dragging=false;
d.paused=false;
});
floatingItems.push(d);
});
}

let lastFrame=performance.now();

function animateFloating(now){
const dt=Math.min((now-lastFrame)/16.67,2);
lastFrame=now;
if(currentPage==="home"){
floatingItems.forEach(d=>{
if(d.dragging||d.paused)return;
d.x+=d.vx*dt;
d.y+=d.vy*dt;
const maxX=innerWidth-d.size-8;
const maxY=innerHeight-d.size-35;
if(d.x<8){d.x=8;d.vx=Math.abs(d.vx)}
if(d.x>maxX){d.x=maxX;d.vx=-Math.abs(d.vx)}
if(d.y<65){d.y=65;d.vy=Math.abs(d.vy)}
if(d.y>maxY){d.y=maxY;d.vy=-Math.abs(d.vy)}
d.element.style.transform=`translate3d(${d.x}px,${d.y}px,0)`;
});
}
requestAnimationFrame(animateFloating);
}

/* SEAM GUARD */
const textileSeamProfiles=new WeakMap();

function textileSeamProfile(image){
if(textileSeamProfiles.has(image))return textileSeamProfiles.get(image);
const iw=image.naturalWidth||image.width||240;
const ih=image.naturalHeight||image.height||240;
let result={x:0,y:0};

try{
const edgeX=Math.max(1,Math.min(2,Math.floor(iw/8)));
const edgeY=Math.max(1,Math.min(2,Math.floor(ih/8)));
const inX=Math.max(edgeX+1,Math.min(iw-edgeX,Math.round(iw*.009)));
const inY=Math.max(edgeY+1,Math.min(ih-edgeY,Math.round(ih*.009)));

const vertical=makeCanvas(16,64);
const vc=vertical.getContext("2d",{willReadFrequently:true});
for(let i=0;i<4;i++){
const sx=i===0?0:i===1?inX:i===2?iw-edgeX:iw-inX-edgeX;
vc.drawImage(image,Math.max(0,Math.min(iw-edgeX,sx)),0,edgeX,ih,i*4,0,4,64);
}

const horizontal=makeCanvas(64,16);
const hc=horizontal.getContext("2d",{willReadFrequently:true});
for(let i=0;i<4;i++){
const sy=i===0?0:i===1?inY:i===2?ih-edgeY:ih-inY-edgeY;
hc.drawImage(image,0,Math.max(0,Math.min(ih-edgeY,sy)),iw,edgeY,0,i*4,64,4);
}

const vx=vc.getImageData(0,0,16,64).data;
const hy=hc.getImageData(0,0,64,16).data;

function score(data,w,outer,inside,verticalStrip){
let fringe=0;
for(let k=0;k<64;k++){
const a=(verticalStrip?(k*w+outer*4+1):(outer*4+1)*w+k)*4;
const b=(verticalStrip?(k*w+inside*4+1):(inside*4+1)*w+k)*4;
const bright=data[a]>=239&&data[a+1]>=239&&data[a+2]>=239;
const transparent=data[a+3]<225;
const innerColored=Math.min(data[b],data[b+1],data[b+2])<225&&data[b+3]>200;
const innerOpaque=data[b+3]>235;
const outerLight=.2126*data[a]+.7152*data[a+1]+.0722*data[a+2];
const innerLight=.2126*data[b]+.7152*data[b+1]+.0722*data[b+2];
const lightHalo=outerLight>175&&outerLight-innerLight>25&&innerOpaque;
if((bright&&innerColored)||(transparent&&innerOpaque)||lightHalo)fringe++;
}
return fringe/64;
}

const xScore=Math.max(score(vx,16,0,1,true),score(vx,16,2,3,true));
const yScore=Math.max(score(hy,64,0,1,false),score(hy,64,2,3,false));
result={
x:xScore>.23?2:xScore>.09?1:0,
y:yScore>.23?2:yScore>.09?1:0
};
}catch(error){
result={x:2,y:2};
}
textileSeamProfiles.set(image,result);
return result;
}

function paintSeamGuardedTile(ctx,image,width,height){
const seam=textileSeamProfile(image);
const iw=image.naturalWidth||image.width||240;
const ih=image.naturalHeight||image.height||240;
const sw=Math.max(1,Math.round(width));
const sh=Math.max(1,Math.round(height));

const sourceTrimX=seam.x
?Math.min(Math.floor(iw/8),Math.max(seam.x,Math.ceil((seam.x+.75)*iw/sw)))
:0;
const sourceTrimY=seam.y
?Math.min(Math.floor(ih/8),Math.max(seam.y,Math.ceil((seam.y+.75)*ih/sh)))
:0;

ctx.imageSmoothingEnabled=true;
ctx.imageSmoothingQuality="high";

if(!sourceTrimX&&!sourceTrimY){
ctx.drawImage(image,0,0,sw,sh);
return;
}

ctx.drawImage(
image,
sourceTrimX,sourceTrimY,
Math.max(1,iw-2*sourceTrimX),
Math.max(1,ih-2*sourceTrimY),
0,0,sw,sh
);
}

let fullscreenDrawQueued=false;

function schedulePatternDraw(){
if(fullscreenDrawQueued)return;
fullscreenDrawQueued=true;
requestAnimationFrame(()=>{
fullscreenDrawQueued=false;
drawPatternTiles();
});
}

function drawPatternTiles(){
if(currentPage!=="fullscreen"||!activeImage)return;

const W=Math.max(1,Math.ceil(patternLayer.clientWidth));
const H=Math.max(1,Math.ceil(patternLayer.clientHeight));
const dpr=Math.min(
window.devicePixelRatio||1,
(navigator.maxTouchPoints||0)>1?1.5:2
);
const pw=Math.round(W*dpr);
const ph=Math.round(H*dpr);

if(repeatCanvas.width!==pw||repeatCanvas.height!==ph){
repeatCanvas.width=pw;
repeatCanvas.height=ph;
}

const iw=activeImage.naturalWidth||240;
const ih=activeImage.naturalHeight||240;
const cellW=Math.max(1,Math.round(240*zoom));
const cellH=Math.max(1,Math.round(cellW*ih/iw));
const tw=Math.max(1,Math.round(cellW*dpr));
const th=Math.max(1,Math.round(cellH*dpr));
const cacheKey=activeImageSrc+":"+tw+":"+th;

if(cacheKey!==fullscreenTileCacheKey){
const tile=makeCanvas(tw,th);
paintSeamGuardedTile(tile.getContext("2d"),activeImage,tw,th);
fullscreenTileCache=tile;
fullscreenTileCacheKey=cacheKey;
}

repeatCtx.setTransform(1,0,0,1,0,0);
repeatCtx.clearRect(0,0,pw,ph);
const pattern=repeatCtx.createPattern(fullscreenTileCache,"repeat");

if(pattern){
const tx=Math.round(offsetX*dpr);
const ty=Math.round(offsetY*dpr);
repeatCtx.save();
repeatCtx.translate(tx,ty);
repeatCtx.fillStyle=pattern;
repeatCtx.fillRect(-tx,-ty,pw,ph);
repeatCtx.restore();
}

document.getElementById("zoomValue").textContent=Math.round(zoom*100)+"%";
}

async function updatePattern(){
const token=++patternToken;
const variant=getVariant();
document.getElementById("fullVariantTitle").textContent=variant?.name||"";
if(!variant?.src){
activeImage=null;
activeImageSrc=null;
ensureTiles(0);
return;
}

const img=await loadImage(variant.src);
if(token!==patternToken)return;

if(!img){
activeImage=null;
activeImageSrc=null;
ensureTiles(0);
return;
}

activeImage=img;
activeImageSrc=variant.src;
drawPatternTiles();
}

/* MOUSE */
let dragging=false;
let dragX=0;
let dragY=0;

fullscreen.addEventListener("pointerdown",e=>{
if(e.pointerType==="touch"||e.target.closest("button"))return;
if(e.button!==0)return;
dragging=true;
dragX=e.clientX;
dragY=e.clientY;
fullscreen.classList.add("dragging");
fullscreen.setPointerCapture(e.pointerId);
});

fullscreen.addEventListener("pointermove",e=>{
if(e.pointerType==="touch"||!dragging)return;
offsetX+=e.clientX-dragX;
offsetY+=e.clientY-dragY;
dragX=e.clientX;
dragY=e.clientY;
schedulePatternDraw();
});

function stopDrag(){
dragging=false;
fullscreen.classList.remove("dragging");
}
fullscreen.addEventListener("pointerup",stopDrag);
fullscreen.addEventListener("pointercancel",stopDrag);

/* IPAD FULLSCREEN PINCH */
let fullTouchGesture=null;
let fullTouchLast=null;

function fullTouchPair(touches){
const a=touches[0];
const b=touches[1];
return {
centerX:(a.clientX+b.clientX)/2,
centerY:(a.clientY+b.clientY)/2,
distance:Math.max(1,Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY))
};
}

function startFullPinch(touches){
const p=fullTouchPair(touches);
fullTouchGesture={...p,zoom,offsetX,offsetY};
fullTouchLast=null;
}

fullscreen.addEventListener("touchstart",e=>{
if(e.target.closest("button"))return;
if(e.touches.length===2){
e.preventDefault();
startFullPinch(e.touches);
}else if(e.touches.length===1){
e.preventDefault();
fullTouchGesture=null;
fullTouchLast={
x:e.touches[0].clientX,
y:e.touches[0].clientY
};
}
},{passive:false});

fullscreen.addEventListener("touchmove",e=>{
if(e.target.closest("button"))return;
if(e.touches.length===2){
e.preventDefault();
if(!fullTouchGesture)startFullPinch(e.touches);
const p=fullTouchPair(e.touches);
const g=fullTouchGesture;
zoom=Math.max(.15,Math.min(8,g.zoom*p.distance/g.distance));
const ratio=zoom/g.zoom;
offsetX=p.centerX-(g.centerX-g.offsetX)*ratio;
offsetY=p.centerY-(g.centerY-g.offsetY)*ratio;
schedulePatternDraw();
}else if(e.touches.length===1){
e.preventDefault();
const t=e.touches[0];
if(fullTouchLast){
offsetX+=t.clientX-fullTouchLast.x;
offsetY+=t.clientY-fullTouchLast.y;
schedulePatternDraw();
}
fullTouchLast={x:t.clientX,y:t.clientY};
fullTouchGesture=null;
}
},{passive:false});

function endFullTouch(e){
if(e.touches.length===1){
fullTouchLast={x:e.touches[0].clientX,y:e.touches[0].clientY};
}else{
fullTouchLast=null;
}
fullTouchGesture=null;
}

fullscreen.addEventListener("touchend",endFullTouch,{passive:false});
fullscreen.addEventListener("touchcancel",endFullTouch,{passive:false});

["gesturestart","gesturechange","gestureend"].forEach(name=>{
fullscreen.addEventListener(name,e=>e.preventDefault(),{passive:false});
});

function setZoom(next,x,y){
const old=zoom;
zoom=Math.max(.15,Math.min(next,8));
const ratio=zoom/old;
offsetX=x-(x-offsetX)*ratio;
offsetY=y-(y-offsetY)*ratio;
schedulePatternDraw();
}

fullscreen.addEventListener("wheel",e=>{
e.preventDefault();
setZoom(zoom*(e.deltaY<0?1.1:.9),e.clientX,e.clientY);
},{passive:false});

document.getElementById("zoomIn").onclick=()=>setZoom(zoom*1.25,innerWidth/2,innerHeight/2);
document.getElementById("zoomOut").onclick=()=>setZoom(zoom/1.25,innerWidth/2,innerHeight/2);

function locateHintTip(point){
const preferred={x:point.x/100,y:point.y/100};
if(mockupType!=="bedding"||point.id==="background")return preferred;
const mask=mockupLayerMasks[point.id];
if(!mask)return preferred;

const {sample,sampleW:w,sampleH:h}=mask;
const alphaAt=(x,y)=>sample[(y*w+x)*4+3];
let best=null;
let score=Infinity;

for(let y=4;y<h-4;y+=2){
for(let x=4;x<w-4;x+=2){
if(alphaAt(x,y)<215)continue;
if(alphaAt(x-4,y)<160||
alphaAt(x+4,y)<160||
alphaAt(x,y-4)<160||
alphaAt(x,y+4)<160)continue;
const nx=x/w;
const ny=y/h;
if(point.id.startsWith("pillow")&&(ny<.35||ny>.76))continue;
const d=(nx-preferred.x)**2+(ny-preferred.y)**2;
if(d<score){
score=d;
best={x:nx,y:ny};
}
}
}
return best||preferred;
}

function validHex(value){
value=String(value||"").trim();
if(/^#[0-9a-fA-F]{3}$/.test(value)){
return "#"+[1,2,3].map(i=>value[i]+value[i]).join("").toLowerCase();
}
return /^#[0-9a-fA-F]{6}$/.test(value)?value.toLowerCase():null;
}

function rgbFromHex(hex){
const v=validHex(hex)||"#ffffff";
return [1,3,5].map(i=>parseInt(v.slice(i,i+2),16));
}

function hexFromRgb(r,g,b){
return "#"+[r,g,b].map(v=>
Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")
).join("");
}

function toHSV(hex){
const [r,g,b]=rgbFromHex(hex).map(x=>x/255);
const mx=Math.max(r,g,b);
const mn=Math.min(r,g,b);
const delta=mx-mn;
let h=0;
if(delta){
if(mx===r)h=((g-b)/delta)%6;
else if(mx===g)h=(b-r)/delta+2;
else h=(r-g)/delta+4;
h=((h*60)%360+360)%360;
}
return {h,s:mx?delta/mx:0,v:mx};
}

function fromHSV(h,s,v){
h=((h%360)+360)%360;
s=Math.max(0,Math.min(1,s));
v=Math.max(0,Math.min(1,v));
const c=v*s;
const x=c*(1-Math.abs((h/60)%2-1));
const m=v-c;
let a=[0,0,0];
if(h<60)a=[c,x,0];
else if(h<120)a=[x,c,0];
else if(h<180)a=[0,c,x];
else if(h<240)a=[0,x,c];
else if(h<300)a=[x,0,c];
else a=[c,0,x];
return hexFromRgb(...a.map(t=>(t+m)*255));
}

function toCMYK(hex){
const [r,g,b]=rgbFromHex(hex).map(v=>v/255);
const k=1-Math.max(r,g,b);
if(k>.999)return [0,0,0,100];
return [
Math.round((1-r-k)/(1-k)*100),
Math.round((1-g-k)/(1-k)*100),
Math.round((1-b-k)/(1-k)*100),
Math.round(k*100)
];
}

function fromCMYK(c,m,y,k){
c/=100;
m/=100;
y/=100;
k/=100;
return hexFromRgb(
255*(1-c)*(1-k),
255*(1-m)*(1-k),
255*(1-y)*(1-k)
);
}

/* IMAGE LOADING */
function imgurCandidates(id,ext="png",local=null){
const urls=[];
const localURL=local?`./mockup_images/${local}.png`:null;
const onPages=/(^|\.)github\.io$/i.test(location.hostname);
if(localURL&&!onPages)urls.push(localURL);
urls.push(`https://i.imgur.com/${id}.${ext}`);
urls.push(`https://i.imgur.com/${id}.${ext==="png"?"jpg":"png"}`);
if(localURL&&onPages)urls.push(localURL);
return urls;
}

function imgWithCors(url){
return new Promise(resolve=>{
const img=new Image();
img.crossOrigin="anonymous";
img.decoding="async";
img.onload=()=>resolve(img);
img.onerror=()=>resolve(null);
img.src=url;
});
}

const mockupLoadCache=new Map();

async function loadMockupImageFrom(candidates){
for(const url of candidates){
if(!mockupLoadCache.has(url)){
mockupLoadCache.set(url,imgWithCors(url));
}
const image=await mockupLoadCache.get(url);
if(image)return image;
}
return null;
}

function maskFromLayer(image,kind,W,H){
const c=makeCanvas(W,H);
const cx=c.getContext("2d",{willReadFrequently:true});
cx.drawImage(image,0,0,W,H);
let data;

try{
data=cx.getImageData(0,0,W,H);
}catch(err){
return null;
}

const d=data.data;
let transparent=0;
for(let i=3;i<d.length;i+=Math.max(4,Math.floor(d.length/8000/4)*4)){
if(d[i]<245)transparent++;
}

if(transparent===0){
const corners=[[3,3],[W-4,3],[3,H-4],[W-4,H-4]];
const avg=[0,0,0];

for(const [x,y] of corners){
const q=(y*W+x)*4;
for(let j=0;j<3;j++)avg[j]+=d[q+j]/4;
}

const invert=kind==="background";
for(let i=0;i<d.length;i+=4){
const dist=Math.sqrt(
(d[i]-avg[0])**2+
(d[i+1]-avg[1])**2+
(d[i+2]-avg[2])**2
);
const a=Math.max(0,Math.min(255,(dist-12)*5));
d[i]=255;
d[i+1]=255;
d[i+2]=255;
d[i+3]=invert?255-a:a;
}
cx.putImageData(data,0,0);
}

const sw=MASK_SAMPLE_SIZE;
const sh=Math.max(1,Math.round(H/W*sw));
const sc=makeCanvas(sw,sh);
const sx=sc.getContext("2d",{willReadFrequently:true});
sx.drawImage(c,0,0,sw,sh);
const sample=sx.getImageData(0,0,sw,sh).data;

return {canvas:c,sample,sampleW:sw,sampleH:sh};
}

function maskAlpha(id,x,y){
const m=mockupLayerMasks[id];
if(!m)return 0;
const ix=Math.min(m.sampleW-1,Math.max(0,Math.floor(x/mockupCanvas.width*m.sampleW)));
const iy=Math.min(m.sampleH-1,Math.max(0,Math.floor(y/mockupCanvas.height*m.sampleH)));
return m.sample[(iy*m.sampleW+ix)*4+3];
}

function hitMockupLayer(x,y){
const layers=activeMockupConfig().layers;

for(const l of [...layers].reverse()){
if(l.kind==="background"||l.kind==="auto")continue;
if(maskAlpha(l.id,x,y)>35)return l.id;
}

const main=layers.find(l=>l.kind==="pattern");
if(main&&!mockupLayerMasks[main.id]){
const u=x/mockupCanvas.width;
const v=y/mockupCanvas.height;
const fallback={
dress:[.31,.69,.16,.91],
tshirt:[.18,.82,.19,.85],
bag:[.2,.8,.23,.83]
}[mockupType];

if(fallback&&
u>=fallback[0]&&u<=fallback[1]&&
v>=fallback[2]&&v<=fallback[3]){
return main.id;
}
}

return layers.find(l=>l.kind==="background")?.id||null;
}

function getCanvasPoint(e){
const rect=mockupCanvas.getBoundingClientRect();
const w=mockupCanvas.width;
const h=mockupCanvas.height;
const ratio=Math.min(rect.width/w,rect.height/h);
const left=(rect.width-w*ratio)/2;
const top=(rect.height-h*ratio)/2;
const x=(e.clientX-rect.left-left)/ratio;
const y=(e.clientY-rect.top-top)/ratio;
return {x,y,inside:x>=0&&y>=0&&x<w&&y<h};
}

for(const [layer,image] of results){

}
const mask=maskFromLayer(

mockupBusy=false;
mockupStatus.textContent=mockupAssetErrors.length
?"일부 이미지 로드 실패 · 오른쪽 안내 확인"

/* MOCKUP REPEAT */
const textileTileCache=new WeakMap();

function drawSeamlessTextile(ctx,image,state,W,H){
const naturalW=image.naturalWidth||240;
const naturalH=image.naturalHeight||240;
const cellW=Math.max(4,Math.round(240*state.scale/100));
const cellH=Math.max(4,Math.round(cellW*naturalH/naturalW));
const tileKey=cellW+":"+cellH;

let cache=textileTileCache.get(image);
if(!cache){
cache=new Map();
textileTileCache.set(image,cache);
}

let tile=cache.get(tileKey);
if(!tile){
tile=makeCanvas(cellW,cellH);
paintSeamGuardedTile(tile.getContext("2d"),image,cellW,cellH);
if(cache.size>=8){
cache.delete(cache.keys().next().value);
}
cache.set(tileKey,tile);
}

const repeat=ctx.createPattern(tile,"repeat");
if(!repeat)return;

const cx=Math.round(W/2+state.x);
const cy=Math.round(H/2+state.y);
const radius=Math.ceil(Math.hypot(W,H)+Math.max(cellW,cellH));

ctx.save();
ctx.translate(cx,cy);
ctx.rotate(state.rotation*Math.PI/180);
ctx.fillStyle=repeat;
ctx.fillRect(-radius,-radius,2*radius,2*radius);
ctx.restore();
}

const mockupWorkCanvas=makeCanvas(1,1);
const mockupWorkCtx=mockupWorkCanvas.getContext("2d");

function drawMasked(layer,fillPattern=false){
const mask=mockupLayerMasks[layer.id];
if(!mask)return;

const W=mockupCanvas.width;
const H=mockupCanvas.height;

if(mockupWorkCanvas.width!==W||mockupWorkCanvas.height!==H){
mockupWorkCanvas.width=W;
mockupWorkCanvas.height=H;
}

const c=mockupWorkCanvas;
const x=mockupWorkCtx;

x.setTransform(1,0,0,1,0,0);
x.globalCompositeOperation="source-over";
x.clearRect(0,0,W,H);

const state=mockupState(layer.id);

if(fillPattern&&state.mode!=="color"){
const image=getMockupPatternImage(layer);
if(!image)return;
drawSeamlessTextile(x,image,state,W,H);
}else{
const targetColor=layer.kind==="auto"
?getPattern().colors[mockupState(layer.parent).variant]||getPattern().colors[0]
:state.color;

x.fillStyle=targetColor||"#ffffff";
x.fillRect(0,0,W,H);
}

x.globalCompositeOperation="destination-in";
x.drawImage(mask.canvas,0,0,W,H);
x.globalCompositeOperation="source-over";

mockupCtx.save();
mockupCtx.globalCompositeOperation="multiply";
mockupCtx.drawImage(c,0,0);
mockupCtx.restore();
}

let mockupRenderQueued=false;

function renderMockup(){
if(mockupRenderQueued)return;
mockupRenderQueued=true;
requestAnimationFrame(()=>{
mockupRenderQueued=false;
drawMockup();
});
}

function drawMockup(){
const W=mockupCanvas.width;
const H=mockupCanvas.height;
mockupCtx.clearRect(0,0,W,H);
mockupCtx.fillStyle="#ffffff";
mockupCtx.fillRect(0,0,W,H);

if(mockupPhoto){
mockupCtx.drawImage(mockupPhoto,0,0,W,H);
}

for(const layer of activeMockupConfig().layers){
if(layer.kind==="pattern"||layer.kind==="both"){
drawMasked(layer,true);
}else{
drawMasked(layer,false);
}
}

if(!mockupPhoto){
mockupCtx.fillStyle="#666";
mockupCtx.font="20px Arial";
mockupCtx.textAlign="center";
mockupCtx.fillText(
mockupBusy
?"목업 이미지 로딩 중..."
:"목업 원본 이미지를 불러오지 못했습니다.",
W/2,H/2
);
}
}

/* EXTRACT COLORS */
const extractedPaletteCache=new Map();

function getPaletteVariantForLayer(layer){
const config=activeMockupConfig();
if(layer.kind==="background"){
const textileLayer=
config.layers.find(l=>l.kind==="pattern")||
config.layers.find(l=>l.id==="duvet")||
config.layers.find(l=>l.kind==="both");
return mockupState(textileLayer?.id)?.variant??currentColor;
}
return mockupState(layer.id)?.variant??currentColor;
}

function extractTextilePalette(image,firstColor,cacheKey){
const first=validHex(firstColor)||"#ffffff";
if(!image)return [first];

const key=cacheKey+":"+first;
if(extractedPaletteCache.has(key)){
return extractedPaletteCache.get(key);
}

try{
const size=112;
const ratio=(image.naturalHeight||1)/(image.naturalWidth||1);
const w=ratio>1?Math.max(1,Math.round(size/ratio)):size;
const h=ratio>1?size:Math.max(1,Math.round(size*ratio));

const c=makeCanvas(w,h);
const ctx=c.getContext("2d",{willReadFrequently:true});
ctx.drawImage(image,0,0,w,h);

const pixels=ctx.getImageData(0,0,w,h).data;
const buckets=new Map();

for(let i=0;i<pixels.length;i+=4){
if(pixels[i+3]<180)continue;
const r=pixels[i];
const g=pixels[i+1];
const b=pixels[i+2];
const code=((r>>5)<<6)|((g>>5)<<3)|(b>>5);
let bucket=buckets.get(code);

if(!bucket){
bucket={n:0,r:0,g:0,b:0};
buckets.set(code,bucket);
}

bucket.n++;
bucket.r+=r;
bucket.g+=g;
bucket.b+=b;
}

const candidates=[...buckets.values()]
.sort((a,b)=>b.n-a.n)
.map(v=>hexFromRgb(v.r/v.n,v.g/v.n,v.b/v.n));

const palette=[first];

const distance=(a,b)=>{
const x=rgbFromHex(a);
const y=rgbFromHex(b);
return Math.sqrt(
.3*(x[0]-y[0])**2+
.59*(x[1]-y[1])**2+
.11*(x[2]-y[2])**2
);
};

for(const minimum of [58,38,25]){
for(const color of candidates){
if(palette.length===8)break;
if(palette.every(existing=>distance(existing,color)>=minimum)){
palette.push(color);
}
}
if(palette.length===8)break;
}

extractedPaletteCache.set(key,palette);
return palette;
}catch(err){
return [first];
}
}

/* IPAD MOCKUP PINCH + ROTATION */
let mockupTouchPinch=null;
let mockupTouchSuppressed=false;

function mockupTouchCoords(touches){
const a=touches[0];
const b=touches[1];
return {
x:(a.clientX+b.clientX)/2,
y:(a.clientY+b.clientY)/2,
distance:Math.max(1,Math.hypot(
b.clientX-a.clientX,
b.clientY-a.clientY
)),
angle:Math.atan2(
b.clientY-a.clientY,
b.clientX-a.clientX
)*180/Math.PI
};
}

function normalizeMockupRotation(degrees){
return ((degrees+180)%360+360)%360-180;
}

function resizableMockupLayer(layer){
return !!layer&&(
layer.kind==="pattern"||
(layer.kind==="both"&&mockupState(layer.id)?.mode==="pattern")
);
}

function startMockupPinch(touches){
const center=mockupTouchCoords(touches);
const mid=getCanvasPoint({
clientX:center.x,
clientY:center.y
});

const candidateId=mid.inside
?hitMockupLayer(mid.x,mid.y)
:null;

const candidate=activeMockupConfig().layers.find(
l=>l.id===candidateId
);
const selected=activeMockupLayer();
const first=activeMockupConfig().layers.find(resizableMockupLayer);

const target=resizableMockupLayer(candidate)
?candidate
:(resizableMockupLayer(selected)?selected:first);

mockupDrag=null;
mockupCanvas.classList.remove("dragging");

if(!target){
mockupTouchPinch=null;
return;
}

if(target.id!==selectedMockupLayer){
setMockupSelection(target.id);
}

mockupTouchPinch={
id:target.id,
distance:center.distance,
scale:mockupState(target.id).scale,
previousAngle:center.angle
};

mockupTouchSuppressed=true;
dismissMockupHints();
}

function syncMockupTransformUI(key,value){
const slider=inspectorContent.querySelector(
`input[data-mockup-transform="${key}"]`
);
const output=inspectorContent.querySelector(

if(output){
output.textContent=value+(key==="scale"?"%":"°");
}
}

function syncMockupScaleUI(value){
syncMockupTransformUI("scale",value);
}

mockupCanvas.addEventListener("touchstart",e=>{
if(currentPage!=="mockup")return;
e.preventDefault();

if(e.touches.length>=2){
startMockupPinch(e.touches);
return;
}

if(e.touches.length!==1||mockupBusy)return;

mockupTouchSuppressed=false;
const t=e.touches[0];
const p=getCanvasPoint(t);

if(!p.inside)return;
dismissMockupHints();

if(mockupEyeSample){
try{
const pixels=mockupCtx.getImageData(
Math.floor(p.x),Math.floor(p.y),1,1
).data;
const s=mockupState(mockupEyeSample);

if(s){
s.color=hexFromRgb(pixels[0],pixels[1],pixels[2]);
selectedMockupLayer=mockupEyeSample;
renderMockupInspector();
renderMockup();
}
}catch(err){
mockupStatus.textContent="이미지에서 색을 읽을 수 없습니다.";
}
mockupEyeSample=null;
return;
}

const id=hitMockupLayer(p.x,p.y);
setMockupSelection(id);
const layer=activeMockupLayer();

if(resizableMockupLayer(layer)){
const s=mockupState(id);
mockupDrag={
layerId:id,
startX:t.clientX,
startY:t.clientY,
x:s.x,
y:s.y,
moving:false
};
}
},{passive:false});

mockupCanvas.addEventListener("touchmove",e=>{
if(currentPage!=="mockup")return;
e.preventDefault();

if(e.touches.length>=2){
if(!mockupTouchPinch){
startMockupPinch(e.touches);
}
if(!mockupTouchPinch)return;

const state=mockupState(mockupTouchPinch.id);
if(!state)return;

const center=mockupTouchCoords(e.touches);
const gesture=mockupTouchPinch;

const value=Math.max(20,Math.min(600,
Math.round(
gesture.scale*
center.distance/
gesture.distance
)
));

const deltaAngle=normalizeMockupRotation(
center.angle-gesture.previousAngle
);
gesture.previousAngle=center.angle;

const rotation=normalizeMockupRotation(
state.rotation+deltaAngle
);

let changed=false;

if(state.scale!==value){
state.scale=value;
syncMockupTransformUI("scale",value);
changed=true;
}

if(Math.abs(rotation-state.rotation)>0.0001){
state.rotation=rotation;
syncMockupTransformUI("rotation",Math.round(rotation));
changed=true;
}

if(changed)renderMockup();
return;
}

if(e.touches.length===1&&!mockupTouchSuppressed&&mockupDrag){
const t=e.touches[0];
const s=mockupState(mockupDrag.layerId);
if(!s)return;

const rect=mockupCanvas.getBoundingClientRect();
const ratio=Math.min(
rect.width/mockupCanvas.width,
rect.height/mockupCanvas.height
);

const dx=(t.clientX-mockupDrag.startX)/ratio;
const dy=(t.clientY-mockupDrag.startY)/ratio;

if(!mockupDrag.moving&&Math.hypot(dx,dy)<5)return;

mockupDrag.moving=true;
s.x=Math.max(-500,Math.min(500,Math.round(mockupDrag.x+dx)));
s.y=Math.max(-500,Math.min(500,Math.round(mockupDrag.y+dy)));
renderMockup();
}
},{passive:false});

function endMockupTouch(e){
if(e.touches.length<2){
mockupTouchPinch=null;
}

if(e.touches.length===0){
if(mockupDrag?.moving){
renderMockupInspector();
}
mockupDrag=null;
mockupTouchSuppressed=false;
}else{
mockupDrag=null;
mockupTouchSuppressed=true;
}
}

mockupCanvas.addEventListener("touchend",endMockupTouch,{passive:false});
mockupCanvas.addEventListener("touchcancel",endMockupTouch,{passive:false});

["gesturestart","gesturechange","gestureend"].forEach(name=>{
mockupCanvas.addEventListener(
name,
e=>e.preventDefault(),
{passive:false}
);
});

async function preloadMockupPatterns(){
const indexAtStart=currentPattern;
const chosen=getPattern();

const jobs=chosen.variants.map(async(variant,i)=>{
const id=variant.src?.match(
/i\.imgur\.com\/([^/.]+)/
)?.[1];

const image=id
?await loadMockupImageFrom(
imgurCandidates(id,"png",`pattern_${indexAtStart+1}_${i+1}`)
)
:null;

if(currentPage!=="mockup"||currentPattern!==indexAtStart){
return image;
}

mockupPatternImages[i]=image;
renderMockup();

if(i===currentColor||
i===getPaletteVariantForLayer(
activeMockupLayer()||{kind:"background"}
)){
renderMockupInspector();
}
return image;
});

const results=await Promise.all(jobs);

if(currentPage!=="mockup"||currentPattern!==indexAtStart){
return;
}

if(results.some(x=>!x)){
mockupStatus.textContent=
"일부 패턴 이미지를 읽지 못했습니다. 로컬 PNG 저장을 권장합니다.";
}
}

inspectorContent.addEventListener("input",()=>dismissMockupHints());

inspectorContent.addEventListener("click",e=>{
if(e.target.closest("button,input,canvas")){
dismissMockupHints();
}
});

/* OPEN MOCKUP */
function openMockup(){
mockupStates=initialMockupStates();
mockupEyeSample=null;
mockupPatternImages={};
mockupHintsDismissed=false;
showPage("mockup");
renderMockupHints();
selectMockupType("dress");
preloadMockupPatterns();
}

function onMockupThemeChange(){
renderMockup();
}

document.querySelectorAll("[data-open-mockup]").forEach(button=>{
button.onclick=e=>{
e.stopPropagation();
openMockup();
};
});

document.getElementById("mockupBack").onclick=()=>showPage("detail");

document.getElementById("mockupReset").onclick=()=>{
const previous=selectedMockupLayer;
mockupStates=initialMockupStates();
selectedMockupLayer=previous;
mockupHintsDismissed=false;
renderMockupInspector();
renderMockup();
renderMockupHints();
};

/* THEME */
function toggleTheme(){
isLightMode=!isLightMode;
document.body.classList.toggle("light",isLightMode);
updateHomeImages();
currentColor=preferredVariant(getPattern(),isLightMode?1:0);

if(currentPage==="fullscreen"){
updatePattern();
renderColors();
}

if(currentPage==="mockup"){
onMockupThemeChange();
}
}

document.getElementById("themeButton").onclick=toggleTheme;

/* NAVIGATION */
detailImage.onclick=openFullscreen;

detailImage.addEventListener("keydown",e=>{
if(e.key==="Enter"||e.key===" "){
e.preventDefault();
openFullscreen();
}
});

document.getElementById("detailBack").onclick=()=>showPage("home");
document.getElementById("fullBack").onclick=()=>showPage("detail");
document.getElementById("logo").onclick=()=>showPage("home");

document.addEventListener("keydown",e=>{
if(e.key==="Escape"){
if(currentPage==="fullscreen"||currentPage==="mockup"){
showPage("detail");
}else if(currentPage==="detail"){
showPage("home");
}
}

if(currentPage==="fullscreen"){
if(e.key==="+"){
setZoom(zoom*1.2,innerWidth/2,innerHeight/2);
}
if(e.key==="-"){
setZoom(zoom/1.2,innerWidth/2,innerHeight/2);
}
}
});

/* RESIZE */
window.addEventListener("resize",()=>{
floatingItems.forEach(d=>{
d.size=d.element.getBoundingClientRect().width;
d.x=Math.max(0,Math.min(d.x,innerWidth-d.size));
d.y=Math.max(65,Math.min(d.y,innerHeight-d.size));
d.element.style.transform=`translate3d(${d.x}px,${d.y}px,0)`;
});

if(currentPage==="fullscreen")drawPatternTiles();
if(currentPage==="detail")updateDetailImage();
if(currentPage==="mockup")renderMockupHints();
});

/* INITIALIZE */
createFloatingItems();
requestAnimationFrame(animateFloating);
</script>
</body>
</html>
